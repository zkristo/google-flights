# Airports you are willing to fly from / back to, and how you get there from home.
#
# Copy this file to ~/.config/zagflights/hubs.toml (or pass --config PATH) to customise it.
# Transfer times/costs are estimates for getting between the FlixBus stop and the airport
# terminal — tweak them to match how you actually travel.

[settings]
home = "Zagreb"            # FlixBus city you start from and return to
checkin_buffer_min = 120   # be at the departure airport this long before take-off
arrival_buffer_min = 45    # time from landing until you are out of the airport
max_wait_hours = 7         # longest wait between bus and flight, or between two flights
overnight_cost = 0         # € added when a wait runs through the night (hostel, airport bench...)
wait_cost_per_hour = 0     # value of your time: € per hour of waiting beyond free_wait_hours.
                           # Only affects which option wins; shown prices stay real money.
free_wait_hours = 3
hop_max_price = 50         # also try flying ZAG → any airport under this € first (0 = off), and back the same way
self_transfer_min = 180    # minimum gap between two separately booked flights
direct_airlines = true     # check Ryanair and Wizz Air's own prices (cheaper than Kiwi's by a few €)

# The home airport: no long-distance bus, just a transfer from home to the terminal.
[hubs.ZAG]
name = "Zagreb"
home_transfer = { minutes = 45, cost = 8 }   # Pleso shuttle from the bus station (ZET bus 290 is ~€1.3)

[hubs.LJU]
name = "Ljubljana"
stops = [{ flixbus = "Ljubljana", transfer_min = 50, transfer_cost = 5 }]

[hubs.GRZ]
name = "Graz"
stops = [{ flixbus = "Graz", transfer_min = 30, transfer_cost = 3 }]

